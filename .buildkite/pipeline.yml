steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        commands:
          - bun install --frozen-lockfile
          - bun run build
          - golangci-lint run --output.sarif.path golangci-lint.sarif --verbose --timeout 3m
        artifact_paths:
          - golangci-lint.sarif
        plugins:
          - mise#v1.1.6: ~
          - ./.buildkite/plugins/sarif-annotate:
              file: golangci-lint.sarif

      - label: ":terraform: lint"
        command: tflint --chdir=infra/terraform -f sarif > tflint.sarif
        artifact_paths:
          - tflint.sarif
        env:
          TFLINT_LOG: debug
        plugins:
          - mise#v1.1.6: ~
          - ./.buildkite/plugins/sarif-annotate:
              file: tflint.sarif

      - label: ":go: test"
        artifact_paths:
          - coverage.out
          - tests.json
        commands:
          - bun install --frozen-lockfile
          - bun run build
          - go test -json -coverprofile=coverage.out ./... > tests.json
        plugins:
          - mise#v1.1.6: ~
          - wolfeidau/go-test-annotate#v1.0.0:
              file: tests.json

      - label: ":bun: test and check"
        commands:
          - bun install --frozen-lockfile
          - bun run test
          - mise run check
        plugins:
          - mise#v1.1.6: ~

  - label: ":rocket: deploy dev"
    trigger: starlogz-deploy
    # Async so main CI finishes while the deploy waits for approval.
    async: true
    depends_on: quality_checks
    # Bot-merged builds (e.g. Renovate) have no Buildkite creator, which fails the trigger.
    if: build.branch == "main" && build.pull_request.id == null && build.creator.id != null
    build:
      commit: "${BUILDKITE_COMMIT}"
      branch: "${BUILDKITE_BRANCH}"
      message: "${BUILDKITE_MESSAGE}"
