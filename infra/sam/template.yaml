# Local testing/validation only: runs the Lambda build under `sam local start-api`.
# Production infrastructure is Terraform in infra/terraform; nothing here is deployed.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Parameters:
  Arch:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

Resources:
  Starlogz:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [!Ref Arch]
      MemorySize: 512
      Timeout: 30
      # Values come from the env.json generated by infra/sam/run.
      Environment:
        Variables:
          SERVER_URL: ""
          DATABASE_URL: ""
          JWK_CONTENT: ""
          GITHUB_CLIENT_ID: ""
          GITHUB_CLIENT_SECRET: ""
          TOKEN_ENCRYPTION_KEY: ""
          OPERATOR_GITHUB_IDS: ""
          CIMD_ENABLED: ""
          LOG_LEVEL: ""
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
